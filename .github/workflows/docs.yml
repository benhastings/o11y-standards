# Builds docs/ into a site with Zensical (zensical.toml) on every PR that
# touches it, or the registry docs/01 must match, and deploys to GitHub Pages
# on pushes to main. Pages must be set to "GitHub Actions" as its source
# (Settings → Pages).
name: Docs
on:
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      - weaver/registry/**
      - scripts/check-docs-registry.py
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - requirements-docs.txt
      - .github/workflows/docs.yml
      - weaver/registry/**
      - scripts/check-docs-registry.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-docs.txt
      - name: docs/01 matches the registry
        run: python scripts/check-docs-registry.py
      - name: Build (strict, so broken links fail)
        run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
